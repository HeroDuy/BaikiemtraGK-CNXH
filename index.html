<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Quiz Engine - Pro Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@400;500;600&display=swap');
        
        body { 
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .font-cyber { font-family: 'Orbitron', sans-serif; }

        /* Neon Effects */
        .neon-box {
            background: rgba(16, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid #0ff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2), inset 0 0 10px rgba(0, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .neon-box:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6), inset 0 0 15px rgba(0, 255, 255, 0.3);
            border-color: #fff;
            transform: translateY(-2px);
        }
        
        .neon-text {
            color: #0ff;
            text-shadow: 0 0 5px #0ff, 0 0 10px #0ff;
        }

        /* Answer States */
        .opt-correct {
            border-color: #0f0 !important;
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.8), inset 0 0 15px rgba(0, 255, 0, 0.4) !important;
            background: rgba(0, 255, 0, 0.15) !important;
            color: #0f0 !important;
            text-shadow: 0 0 5px #0f0;
        }
        
        .opt-incorrect {
            border-color: #f00 !important;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6), inset 0 0 10px rgba(255, 0, 0, 0.2) !important;
            background: rgba(255, 0, 0, 0.1) !important;
            color: #ff4d4d !important;
            opacity: 0.7;
            pointer-events: none;
        }

        /* Animations */
        .fade-up {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            animation: fadeUpAnim 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes fadeUpAnim {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }

        /* Grid Layout */
        .quiz-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        .q-box { grid-column: 1 / -1; min-height: 160px; }
        
        @media (max-width: 640px) {
            .quiz-grid { grid-template-columns: 1fr; gap: 1rem; }
        }

        /* Background grid overlay */
        .bg-grid {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
            pointer-events: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(16, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: #0ff; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="bg-grid"></div>

    <!-- Watermark -->
    <div class="fixed top-4 left-4 z-50 flex items-center gap-2">
        <i class="fas fa-code text-[#0ff] animate-pulse"></i>
        <span class="font-cyber font-bold text-sm tracking-widest neon-text uppercase opacity-80">
            Tạo bởi Hero Duy
        </span>
    </div>

    <!-- Màn hình 1: Import Data -->
    <div id="screen-import" class="flex-grow flex flex-col items-center justify-center p-6 w-full max-w-4xl mx-auto absolute inset-0 z-10 transition-opacity duration-500">
        <div class="neon-box rounded-2xl w-full p-6 md:p-10 flex flex-col h-[80vh] fade-up">
            <h2 class="font-cyber text-2xl md:text-3xl font-bold neon-text mb-2 text-center uppercase tracking-wider">Khởi Tạo Dữ Liệu</h2>
            <p class="text-gray-400 text-center text-sm mb-6 uppercase tracking-widest">Dán 200 câu hỏi của bạn vào đây</p>
            
            <textarea id="import-textarea" class="w-full flex-grow bg-slate-900 border border-[#0ff] rounded-xl p-4 text-slate-300 font-mono text-sm focus:outline-none focus:shadow-[0_0_15px_rgba(0,255,255,0.3)] resize-none mb-6">
Câu 1: Trên cơ sở những nghiên cứu, phân tích về chủ nghĩa đế quốc, V.I.Lênin phát hiện ra quy luật gì?
a. Quy luật thống nhất và đấu tranh của các mặt đối lập
*b. Quy luật phát triển không đều về kinh tế và chính trị của chủ nghĩa tư bản trong thời kỳ chủ nghĩa đế quốc
c. Cả ba đáp án đều đúng
d. Quy luật về sự phù hợp của quan hệ sản xuất với tính chất và trình độ của lực lượng sản xuất
Câu 2: V.I.Lênin đã nhận xét: "Chủ nghĩa xã hội không tưởng không thể vạch ra được lối thoát thực sự" trong tác phẩm nào?
*a. Ba nguồn gốc và ba bộ phận cấu thành của chủ nghĩa Mác
b. Tuyên ngôn của Đảng Cộng sản
c. Luận cương tháng Tư
d. Chống Đuyrinh
Câu 3: Phát kiến vĩ đại nào của C.Mác và Ph.Ăngghen là sự khẳng định về phương diện kinh tế sự diệt vong không tránh khỏi của chủ nghĩa tư bản và sự ra đời tất yếu của chủ nghĩa xã hội?
a. Chủ nghĩa duy vật lịch sử
b. Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp công nhân
c. Tuyên ngôn của Đảng Cộng sản
*d. Học thuyết về giá trị thặng dư
Câu 4: Tác phẩm nào của Ph.Ăngghen thể hiện việc ông chuyển từ thế giới quan duy tâm sang thế giới quan duy vật, từ lập trường dân chủ cách mạng sang lập trường cộng sản chủ nghĩa?
a. Làm gì?
b. Chống Đuyrinh
*c. Tình cảnh nước Anh; Lược thảo khoa học kinh tế - chính trị
d. Góp phần phê phán triết học pháp quyền của Hêghen - Lời nói đầu
Câu 5: Chủ nghĩa xã hội khoa học được hiểu theo nghĩa rộng là:
a. Một trong ba bộ phận hợp thành chủ nghĩa Mác - Lênin
b. Chủ nghĩa xã hội không tưởng phê phán
*c. Chủ nghĩa Mác - Lênin
d. Hệ tư tưởng của giai cấp nông dân


Câu 6: Mô hình của chế độ xã hội chủ nghĩa ở Liên Xô và Đông Âu sụp đổ vào năm nào?
*a. 1991
b. 1990
c. 1981
d. 1980
Câu 7: Phong trào đấu tranh của giai cấp công nhân Lion *mang mục đích chính trị bằng khẩu hiệu nào?*
a. Cộng hòa hay là chết
b. Độc lập hay là chết
c. Sống có việc làm hay là chết trong đấu tranh
d. Chết trong tự do
Câu 8: Đánh giá về chủ nghĩa Mác, V.I.Lênin chỉ rõ: Học thuyết của Mác là một học thuyết .... vì nó là một học thuyết chính xác". Hãy điền vào chỗ trống
a. Toàn vẹn
*b. Vạn năng
c. Nhất thành bất biến
d. Vạn vật
Câu 9: Chủ nghĩa xã hội khoa học sử dụng phương pháp luận chung nhất gì?
a. Phương pháp so sánh
b. Phương pháp kết hợp lịch sử với lôgíc
*c. Chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử của triết học Mác - Lênin
d. Phương pháp khảo sát và phân tích về mặt chính trị- xã hội
Câu 10: Người có công lao xây dựng chủ nghĩa xã hội hiện thực là:
a. Ph.Ăngghen
b. C.Mác
*c. V.I.Lênin
d. J.Xtalin
Câu 11: Cách mạng vô sản trên thực tế được thực hiện bằng con đường nào?
*a. Bạo lực cách mạng
b. Con đường chính trị
c. Con đường hòa bình
d. Con đường thỏa hiệp
Câu 12: Các Mác và Ph. Ăngghen đã sử dụng thuật ngữ nào để nói về giai cấp công nhân?
a. Giai cấp vô sản
*b. Tất cả các đáp án
c. Giai cấp công nhân hiện đại
d. Giai cấp vô sản hiện đại
Câu 13: Trong cuộc cách mạng về tư tưởng, giai cấp công nhân cần xây dựng và củng cố ý thức hệ tiên tiến của giai cấp mình làm nền tảng tinh thần của xã hội. Ý thức hệ đó là:
a. Chủ nghĩa hiện sinh
b. Hệ tư tưởng phong kiến
c. Hệ tư tưởng dân chủ tư sản
*d. Chủ nghĩa Mác - Lênin
Câu 14: Đối diện với quan hệ sản xuất tư bản chủ nghĩa, giai cấp công nhân có đặc trưng cơ bản:
a. Đại diện cho quan hệ sản xuất tư bản chủ nghĩa
b. Giai cấp bị mất hết đất đai và nghèo khổ nhất
*c. Giai cấp công nhân làm thuê hiện đại, vì mất các tư liệu sản xuất của bản thân, nên buộc phải bán sức lao động của mình để kiếm sống
d. Chủ sở hữu tư liệu sản xuất
Câu 15: Nội dung kinh tế của sứ mệnh lịch sử giai cấp công nhân:
a. Phấn đấu cho lợi ích của riêng giai cấp mình
b. Lợi ích chung và riêng thống nhất
*c. Đại biểu cho lợi ích chung của xã hội
d. Phấn đấu cho lợi ích riêng của giai cấp khác
Câu 16: Nhân tố chủ quan, quan trọng nhất để giai cấp công nhân thực hiện thắng lợi sứ mệnh lịch sử của mình:
a. Có sự phát triển của bản thân giai cấp công nhân
*b. Có sự lãnh đạo của Đảng cộng sản
c. Có sự liên minh giữa giai cấp công nhân với quần chúng nhân dân
d. Có sự liên minh công- nông
Câu 17: Giai cấp công nhân với phương thức lao động công nghiệp trong nền sản xuất tư bản chủ nghĩa, được hiểu là:
a. Giai cấp nghèo khổ nhất, có trình độ xã hội thấp
b. Giai cấp có số lượng đông nhất trong dân cư và trình độ xã hội hóa cao
c. Giai cấp làm giàu cho xã hội trong thời công nghiệp hiện đại
*d. Những người lao động trực tiếp hay gián tiếp vận hành những công cụ sản xuất có tính chất công nghiệp ngày càng hiện đại, có trình độ xã hội hóa cao
Câu 18: Vì sao giai cấp công nhân Việt Nam sớm trở thành lực lượng chính trị độc lập?
a. Kế thừa truyền thống kiên cường bất khuất và yêu nước của dân tộc
b. Có liên hệ mật thiết với giai cấp nông dân
c. Kiên định trong giải quyết vấn đề dân tộc trong thời đại mới
*d. Vì sớm hình thành một chính đảng thực sự cách mạng
Câu 19: Một trong những điều kiện khách quan quy định sứ mệnh lịch sử của giai cấp công nhân:
a. Sự tăng nhanh về số lượng và chất lượng của giai cấp công nhân
b. Sự phát triển về chất của bản thân giai cấp công nhân
*c. Địa vị chính trị - xã hội của giai cấp công nhân
d. Giai cấp công nhân thành lập chính đảng của mình
Câu 20: Sứ mệnh lịch sử của giai cấp công nhân về nhiệm vụ văn hóa tư tưởng:
a. Cải tạo cái cũ, lỗi thời, lạc hậu của các hệ tư tưởng cũ
b. Xây dựng cùng ý thức hệ tiên tiến của giai cấp công nhân, đó là chủ nghĩa Mác- Lênin
c. Xây dựng cái mới tiến bộ trong lĩnh vực ý thức tư tưởng, tâm lý, lối sống và đời sống tinh thần của xã hội
*d. Tất cả các đáp án
Câu 21: Mục tiêu cao nhất của giai cấp công nhân khi thực hiện sứ mệnh lịch sử của mình là:
a. Giải phóng lực lượng sản xuất lạc hậu lỗi thời
b. Giải phóng giai cấp công nhân
*c. Giải phóng con người
d. Giải phóng tư liệu sản xuất có trình độ thấp
Câu 22: Giai cấp công nhân thực hiện sứ mệnh lịch sử của mình thông qua đội tiền phong của mình là:
a. Công đoàn
b. Công hội đỏ
*c. Đảng cộng sản
d. Đảng cộng hòa
Câu 23: Theo chủ nghĩa Mác- Lênin, sứ mệnh lịch sử của giai cấp công nhân sẽ hoàn thành bước thứ nhất khi nào?
a. Giai cấp công nhân giành được nhà máy xí nghiệp của nhà tư bản
b. Giai cấp công nhân thành lập Đảng cộng sản
*c. Giai cấp công nhân giành được chính quyền nhà nước
d. Giai cấp công nhân đấu tranh đòi tăng lượng, giảm giờ làm
Câu 24: Đặc điểm nào khẳng định giai cấp công nhân là giai cấp tiến bộ nhất?
*a. Đại biểu cho phương thức sản xuất hiện đại
b. Có số lượng đông
c. Có tinh thần quốc tế trong sáng
d. Có tính tổ chức kỷ luật cao
Câu 25: Điền từ vào chỗ trống để hoàn thiện luận điểm sau: "Chỉ có giải phóng......thì mới giải phóng được dân tộc; cả hai cuộc giải phóng này chỉ có thể là sự nghiệp của chủ nghĩa cộng sản và cách mạng thế giới" (Hồ Chí Minh).
a. Nhân dân lao động
*b. Giai cấp vô sản
c. Giai cấp công nhân
d. Giai cấp nông dân
Câu 26: Đối tượng mà giai cấp công nhân xóa bỏ khi thực hiện sứ mệnh lịch sử của mình là?
*a. Sở hữu tư nhân tư bản chủ nghĩa về tư liệu sản xuất chủ yếu
b. Sở hữu tư nhân
c. Toàn bộ tư liệu sản xuất của chủ nghĩa tư bản
d. Toàn bộ những gì mà chủ nghĩa tư bản đã tạo ra
Câu 27: Nội dung sứ mệnh lịch sử giai cấp công nhân là gì?
a. Giải quyết mâu thuẫn cơ bản trong sơ sở hạ tầng tư bản chủ nghĩa
*b. Giải quyết mâu thuẫn cơ bản về kinh tế và chính trị trong lòng phương thức sản xuất tư bản chủ nghĩa
c. Giải quyết mâu thuẫn cơ bản giữa giai cấp công nhân và chủ nghĩa tư bản
d. Giải quyết mâu thuẫn cơ bản trong kiến trúc thượng tầng tư bản chủ nghĩa
Câu 28: Quy luật chung, phổ biến cho sự ra đời của Đảng Cộng sản là gì?
*a. Sự kết hợp giữa chủ nghĩa Mác- Lênin với phong trào công nhân
b. Chủ nghĩa Mác – Lênin kết hợp với phong trào nông dân
c. Chủ nghĩa Lênin kết hợp với phong trào công nhân
d. Chủ nghĩa Mác- Lê nin kết hợp với phong trào công nhân và nhân dân lao động
Câu 29: Theo C.Mác và Ph.Ăngghen, điều kiện tiên quyết để giải phóng người lao động ra khỏi các quan hệ bóc lột tư bản chủ nghĩa là gì?
a. Tạo ra cách thức tổ chức lao động và kỷ luật lao động mới với năng suất cao
b. Giải phóng và phát triển toàn diên con người
c. Tạo ra một nền sản xuất công nghiệp hiện đại
*d. Xóa bỏ chế độ sở hữu tư bản chủ nghĩa, đồng thời tiến hành thiết lập chế độ công hữu về các tư liệu sản xuất chủ yếu
Câu 30: Vì sao Đảng cộng sản trở thành đội tiên phong, lãnh tụ chính trị và bộ tham mưu chiến đấu của giai cấp công nhân?*
a. Là một tổ chức chính trị đạt được nhiều thành quả cách mạng nhất
*b. Là một tổ chức chính trị tập trung những người công nhân tiên tiến nhất
c. Là một tổ chức chính trị được giác ngộ lý tưởng cách mạng vô sản
d. Là một tổ chức chính trị được trang bị lý luận cách mạng của chủ nghĩa Mác-Lênin
Câu 31: Về kỹ năng, sau khi học xong lý luận về chủ nghĩa xã hội và thời kỳ quá độ lên chủ nghĩa xã hội, sinh viên cần đạt được điều gì?
a. Quan điểm của chủ nghĩa Mác-Lê nin về chủ nghĩa xã hội và sự vận dụng sáng tạo của Đảng cộng sản
b. Tin tưởng, ủng hộ sự lãnh đạo của Đảng cộng sản Việt Nam

        const uiImport = document.getElementById('screen-import');
        const uiSetup = document.getElementById('screen-setup');
        const uiQuiz = document.getElementById('screen-quiz');
        const uiResult = document.getElementById('screen-result');
        const btnStart = document.getElementById('btn-start');
        const errorMsg = document.getElementById('import-error');

        function parseAndProceed() {
            const raw = document.getElementById('import-textarea').value;
            if(!raw.trim()) {
                showError("Vui lòng dán dữ liệu câu hỏi!");
                return;
            }

            // Tách các block bằng regex tìm chữ Câu X:
            const blocks = raw.split(/(?=Câu\s*\d+[:.-])/i).filter(b => b.trim().length > 0);
            database = [];

            blocks.forEach((block) => {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if(lines.length < 2) return;

                // Lọc bỏ tiền tố "Câu X:", "[Câu X]" cũ để tự đánh số lại
                let rawQ = lines[0];
                let cleanQ = rawQ.replace(/^(Câu\s*\d+[:.-]?\s*|\[Câu\s*\d+\]\s*)/i, '').trim();

                const options = [];
                let correctIdx = 0;

                for(let i = 1; i < lines.length; i++) {
                    let text = lines[i];
                    
                    // Kiểm tra đáp án đúng (có dấu *)
                    if(text.startsWith('*')) {
                        correctIdx = options.length;
                        text = text.substring(1).trim(); 
                    }
                    
                    // Lọc bỏ tiền tố A, B, C, D có sẵn để dùng layout UI
                    text = text.replace(/^[a-d][.)]\s*/i, '').trim();
                    options.push(text);
                }

                if(options.length >= 2) {
                    database.push({ q: cleanQ, options, correct: correctIdx });
                }
            });

            if(database.length === 0) {
                showError("Lỗi: Không trích xuất được câu hỏi. Hãy đảm bảo đúng định dạng bắt đầu bằng 'Câu...'");
                return;
            }

            document.getElementById('total-loaded').innerText = database.length;
            errorMsg.classList.add('hidden');
            switchScreen(uiImport, uiSetup);
        }

        function showError(msg) {
            errorMsg.innerText = msg;
            errorMsg.classList.remove('hidden');
        }

        function selectMode(count) {
            if(count === 'ALL') {
                selectedCount = database.length;
            } else {
                selectedCount = Math.min(count, database.length);
            }
            
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.style.borderColor = '#0ff';
                btn.style.boxShadow = '0 0 10px rgba(0, 255, 255, 0.2), inset 0 0 10px rgba(0, 255, 255, 0.1)';
                btn.classList.remove('bg-[#0ff]', 'bg-opacity-20');
            });

            let activeBtn = count === 30 ? 'btn-mode-30' : (count === 50 ? 'btn-mode-50' : 'btn-mode-all');
            let btnEl = document.getElementById(activeBtn);
            btnEl.style.borderColor = '#fff';
            btnEl.style.boxShadow = '0 0 20px rgba(0, 255, 255, 0.8), inset 0 0 20px rgba(0, 255, 255, 0.4)';
            btnEl.classList.add('bg-[#0ff]', 'bg-opacity-20');

            btnStart.disabled = false;
        }

        function startQuiz() {
            // Trộn toàn bộ data và cắt lấy số lượng cần thiết (Đảm bảo KHÔNG TRÙNG LẶP)
            let shuffledDB = [...database].sort(() => 0.5 - Math.random());
            activeQuizList = shuffledDB.slice(0, selectedCount);
            
            currentIndex = 0;
            currentScore = 0;
            document.getElementById('ui-total-q').innerText = activeQuizList.length;
            
            switchScreen(uiSetup, uiQuiz, () => {
                renderQuestion();
            });
        }

        function renderQuestion() {
            if(currentIndex >= activeQuizList.length) {
                endQuiz();
                return;
            }

            isTransitioning = false;
            isCurrentQuestionFailed = false;
            let qData = activeQuizList[currentIndex];

            // Cập nhật UI Header
            document.getElementById('ui-current-q').innerText = currentIndex + 1;
            document.getElementById('ui-score').innerText = currentScore;
            
            // Render Câu hỏi (Đánh số động từ 1 -> 30/50...)
            let qBox = document.getElementById('box-q');
            let qText = document.getElementById('text-question');
            
            qBox.classList.remove('fade-up');
            void qBox.offsetWidth;
            qBox.classList.add('fade-up');
            qText.innerText = `Câu ${currentIndex + 1}: ${qData.q}`;

            // Render Options
            for(let i=0; i<4; i++) {
                let btn = document.getElementById(`opt-${i}`);
                let txt = document.getElementById(`text-opt-${i}`);
                
                btn.className = `neon-box rounded-xl p-6 text-left font-medium text-lg fade-up delay-${i+2} hover:bg-[#0ff] hover:bg-opacity-10 group`;
                
                if(i < qData.options.length) {
                    btn.disabled = false;
                    btn.style.display = 'block';
                    txt.innerText = qData.options[i];
                } else {
                    btn.style.display = 'none'; // Ẩn nếu câu có ít hơn 4 đáp án
                }
            }
        }

        function checkAnswer(optIndex, btnEl) {
            if(isTransitioning) return;

            let qData = activeQuizList[currentIndex];

            if(optIndex === qData.correct) {
                btnEl.classList.add('opt-correct');
                
                if(!isCurrentQuestionFailed) {
                    currentScore++;
                    document.getElementById('ui-score').innerText = currentScore;
                }

                isTransitioning = true;
                
                setTimeout(() => {
                    currentIndex++;
                    renderQuestion();
                }, 1200);
            } else {
                btnEl.classList.add('opt-incorrect');
                btnEl.disabled = true;
                isCurrentQuestionFailed = true;
            }
        }
function skipQuestion() {
    if(isTransitioning) return;
    
    // Đánh dấu chuyển câu để chặn bấm các nút khác
    isTransitioning = true;
    
    // Tăng thứ tự câu hỏi và hiển thị câu mới ngay lập tức
    currentIndex++;
    renderQuestion();
}
        function endQuiz() {
            document.getElementById('res-score').innerText = currentScore;
            document.getElementById('res-total').innerText = activeQuizList.length;
            let percent = Math.round((currentScore / activeQuizList.length) * 100);
            document.getElementById('res-percent').innerText = `${percent}%`;

            switchScreen(uiQuiz, uiResult, () => {
                if(percent >= 50) {
                    var duration = 3000;
                    var end = Date.now() + duration;
                    (function frame() {
                        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#0ff', '#0f0'] });
                        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#0ff', '#0f0'] });
                        if (Date.now() < end) requestAnimationFrame(frame);
                    }());
                }
            });
        }

        function resetApp() {
            selectedCount = 0;
            btnStart.disabled = true;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.style.borderColor = '#0ff';
                btn.style.boxShadow = '0 0 10px rgba(0, 255, 255, 0.2), inset 0 0 10px rgba(0, 255, 255, 0.1)';
                btn.classList.remove('bg-[#0ff]', 'bg-opacity-20');
            });
            switchScreen(uiResult, uiSetup, null);
        }

        function switchScreen(fromEl, toEl, callback) {
            fromEl.classList.add('opacity-0');
            setTimeout(() => {
                fromEl.classList.add('hidden');
                toEl.classList.remove('hidden');
                void toEl.offsetWidth;
                toEl.classList.remove('opacity-0');
                if(callback) setTimeout(callback, 100);
            }, 500);
        }
window.onload = function() {
    // Ẩn màn hình import ban đầu và thay luôn dữ liệu vào ô text
    document.getElementById('import-textarea').value = myPreloadedData.trim();
    
    // Chạy luôn hàm xử lý dữ liệu
    parseAndProceed();
    
    // Cập nhật lại giao diện để bỏ qua hiệu ứng chuyển cảnh chậm chạp lúc mới vào
    uiImport.classList.add('hidden');
    uiSetup.classList.remove('hidden');
    uiSetup.classList.remove('opacity-0');
};
    </script>
